// Holds the logged-in admin's access token (never a password in code)
var admAccessToken = null;

async function admLogin() {
  var email = document.getElementById('admEmailInput').value.trim();
  var pass = document.getElementById('admPass').value;
  var errEl = document.getElementById('admErr');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }

  try {
    var res = await fetch(SUPABASE_URL_ADMIN + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY_ADMIN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pass })
    });
    var data = await res.json();
    if (res.ok && data.access_token) {
      admAccessToken = data.access_token;
      sessionStorage.setItem('em_access_token', data.access_token);
      if (data.refresh_token) sessionStorage.setItem('em_refresh_token', data.refresh_token);
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminOverlay').style.display = 'block';
      loadLeads();
    } else {
      errEl.textContent = 'Wrong email or password';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'Login failed — check your connection';
    errEl.style.display = 'block';
  }
}

async function admLogout() {
  // Revoke session on Supabase
  try {
    if (admAccessToken) {
      await fetch(SUPABASE_URL_ADMIN + '/auth/v1/logout', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY_ADMIN, 'Authorization': 'Bearer ' + admAccessToken }
      });
    }
  } catch (e) {}
  admAccessToken = null;
  sessionStorage.removeItem('em_access_token');
  sessionStorage.removeItem('em_refresh_token');
  document.getElementById('adminMount').innerHTML = '';
  location.reload();
}

// Auth header helper — uses the logged-in token
function admAuthHeaders(extra) {
  var h = { 'apikey': SUPABASE_KEY_ADMIN, 'Authorization': 'Bearer ' + (admAccessToken || SUPABASE_KEY_ADMIN) };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}

async function loadLeads() {
  var res = await fetch(SUPABASE_URL_ADMIN + '/rest/v1/leads?select=*&order=created_at.desc', {
    headers: admAuthHeaders()
  });
  if (res.status === 401) {
    // Token expired or invalid — force re-login
    admForceRelogin();
    return;
  }
  allLeads = await res.json();
  admUpdateStats();
  admRender();
  renderDashboard();
  var el = document.getElementById('admLastUpdate');
  if (el) el.textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function admForceRelogin() {
  admAccessToken = null;
  sessionStorage.removeItem('em_access_token');
  sessionStorage.removeItem('em_refresh_token');
  var lb = document.getElementById('loginBox');
  var ov = document.getElementById('adminOverlay');
  if (lb) lb.style.display = 'flex';
  if (ov) ov.style.display = 'none';
  var errEl = document.getElementById('admErr');
  if (errEl) { errEl.textContent = 'Session expired — please sign in again'; errEl.style.display = 'block'; }
}

var currentTypeFilter = 'all';

// Determine lead type from status/message
function leadType(l) {
  var s = (l.status||'').toLowerCase();
  if (s === 'newsletter') return 'newsletter';
  if (s === 'guide') return 'guide';
  return 'planning';
}

function admUpdateStats() {
  var t = allLeads.length;
  var planning = allLeads.filter(function(l){return leadType(l)==='planning';}).length;
  var news = allLeads.filter(function(l){return leadType(l)==='newsletter';}).length;
  var guide = allLeads.filter(function(l){return leadType(l)==='guide';}).length;
  document.getElementById('admTotal').textContent = t;
  document.getElementById('admPlanning').textContent = planning;
  document.getElementById('admNewsletter').textContent = news;
  document.getElementById('admGuide').textContent = guide;

  // ── Second row: month comparison, waiting, conversion ──
  var now = new Date();
  var thisMonth = now.getMonth(), thisYear = now.getFullYear();
  var lastMonthDate = new Date(thisYear, thisMonth - 1, 1);
  var lastMonth = lastMonthDate.getMonth(), lastYear = lastMonthDate.getFullYear();

  var thisMonthCount = 0, lastMonthCount = 0;
  allLeads.forEach(function(l) {
    var d = new Date(l.created_at);
    if (d.getMonth() === thisMonth && d.getFullYear() === thisYear) thisMonthCount++;
    else if (d.getMonth() === lastMonth && d.getFullYear() === lastYear) lastMonthCount++;
  });

  // Waiting = planning leads still "new"
  var waiting = allLeads.filter(function(l){ return leadType(l)==='planning' && (l.status||'new')==='new'; }).length;

  // Conversion = done / all planning
  var doneCount = allLeads.filter(function(l){ return leadType(l)==='planning' && l.status==='done'; }).length;
  var conv = planning > 0 ? Math.round(doneCount / planning * 100) : 0;

  var tmEl = document.getElementById('admThisMonth');
  if (tmEl) {
    // show trend arrow vs last month
    var trend = '';
    if (lastMonthCount > 0) {
      if (thisMonthCount > lastMonthCount) trend = ' <span style="color:#4fd1aa;font-size:0.7rem;">↑</span>';
      else if (thisMonthCount < lastMonthCount) trend = ' <span style="color:#e07b6f;font-size:0.7rem;">↓</span>';
    }
    tmEl.innerHTML = thisMonthCount + trend;
  }
  var lmEl = document.getElementById('admLastMonth'); if (lmEl) lmEl.textContent = lastMonthCount;
  var wEl = document.getElementById('admWaiting'); if (wEl) wEl.textContent = waiting;
  var cEl = document.getElementById('admConversion'); if (cEl) cEl.textContent = conv + '%';
}

async function renderDashboard(){
  var wrap = document.getElementById('admDashboard');
  var cards = document.getElementById('admDashCards');
  if(!wrap||!cards) return;

  // New leads waiting
  var newWaiting = allLeads.filter(function(l){ return leadType(l)==='planning' && (l.status||'new')==='new'; });
  var stale = newWaiting.filter(function(l){ return daysAgo(l.created_at) >= 3; });

  // Load bookings for upcoming + to-book counts
  var bkTodo = 0, bkUpcoming = 0;
  try{
    var res = await fetch(SUPABASE_URL_ADMIN + '/rest/v1/bookings?select=status,date', { headers: admAuthHeaders() });
    if(res.ok){
      var bks = await res.json();
      var now = new Date(); var wk = new Date(); wk.setDate(wk.getDate()+7);
      bks.forEach(function(b){
        if((b.status||'todo')==='todo') bkTodo++;
        if(b.date){ var d=new Date(b.date); if(d>=now && d<=wk) bkUpcoming++; }
      });
    }
  }catch(e){}

  var cardsHTML = '';
  cardsHTML += dashCard(newWaiting.length, 'New leads waiting', '#2e8b72', "admSwitchTab('leads',null);setTimeout(function(){admFilterByStatus('new')},100)");
  if(stale.length>0) cardsHTML += dashCard(stale.length, 'Waiting 3+ days ⚠', '#e07b6f', "admSwitchTab('leads',null);setTimeout(function(){admFilterByStatus('new')},100)");
  cardsHTML += dashCard(bkTodo, 'Bookings to make', '#e0a05a', "admSwitchTab('bookings',null)");
  cardsHTML += dashCard(bkUpcoming, 'Activities next 7 days', '#7799ff', "admSwitchTab('bookings',null)");

  cards.innerHTML = cardsHTML;
  wrap.style.display = 'block';
}

function dashCard(num, label, color, onclick){
  return '<div onclick="'+onclick+'" style="background:rgba(200,184,154,0.03);border:1px solid rgba(200,184,154,0.1);border-radius:6px;padding:1rem 1.15rem;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor=\''+color+'66\'" onmouseout="this.style.borderColor=\'rgba(200,184,154,0.1)\'">'+
    '<div style="font-family:\'Playfair Display\',serif;font-size:1.8rem;color:'+color+';line-height:1;">'+num+'</div>'+
    '<div style="font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(200,184,154,0.45);margin-top:0.4rem;">'+label+'</div>'+
  '</div>';
}

function admFilterByStatus(status){
  currentFilter = status;
  document.querySelectorAll('.adm-fbtn:not(.adm-type)').forEach(function(b){
    b.classList.remove('active');
    if(b.textContent.trim().toLowerCase()===status || (status==='new'&&b.textContent.trim()==='New')) b.classList.add('active');
  });
  admRender();
}

function admFilter(f, btn) {
  currentFilter = f;
  // only toggle status-row buttons (not type buttons)
  btn.parentNode.querySelectorAll('.adm-fbtn:not(.adm-type)').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  admRender();
}

function admTypeFilter(f, btn) {
  currentTypeFilter = f;
  document.querySelectorAll('.adm-type').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  admRender();
}

function daysAgo(dateStr) {
  var then = new Date(dateStr);
  var now = new Date();
  var diff = Math.floor((now - then) / (1000*60*60*24));
  return diff;
}

function waitingLabel(days) {
  if (days === 0) return 'Today';
  if (days === 1) return '1 day';
  return days + ' days';
}

function admRender() {
  var search = (document.getElementById('admSearch')||{}).value||'';
  search = search.toLowerCase();
  var sortMode = (document.getElementById('admSort')||{}).value || 'newest';

  var filtered = allLeads.filter(function(l) {
    var mType = currentTypeFilter==='all' || leadType(l)===currentTypeFilter;
    var mf = currentFilter==='all' || l.status===currentFilter;
    var ms = !search||(l.name&&l.name.toLowerCase().includes(search))||(l.email&&l.email.toLowerCase().includes(search));
    return mType && mf && ms;
  });

  // Sort
  filtered.sort(function(a, b) {
    if (sortMode === 'name') {
      return (a.name||'').localeCompare(b.name||'');
    } else if (sortMode === 'oldest') {
      return new Date(a.created_at) - new Date(b.created_at);
    }
    return new Date(b.created_at) - new Date(a.created_at); // newest
  });

  var tbody = document.getElementById('admBody');
  tbody.innerHTML = '';
  var empty = document.getElementById('admEmpty');
  if (filtered.length===0) { empty.style.display='block'; return; }
  empty.style.display='none';
  filtered.forEach(function(l) {
    var d = new Date(l.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    var type = leadType(l);
    var tr = document.createElement('tr');
    if (type === 'planning') {
      tr.className = 'adm-row-status adm-rs-' + (l.status||'new');
      if ((l.status||'new') === 'new') tr.className += ' adm-row-new';
    } else {
      tr.className = 'adm-row-status adm-rs-type-' + type;
    }
    tr.setAttribute('data-lead-id', l.id);
    tr.onclick = function(){admOpenModal(l);};

    // Waiting cell — only meaningful for New planning leads that haven't been actioned
    var waitCell = '<span style="color:rgba(200,184,154,0.2);">—</span>';
    if (type === 'planning' && (l.status||'new') === 'new') {
      var days = daysAgo(l.created_at);
      var cls = 'adm-wait';
      if (days >= 5) cls += ' stale';
      else if (days >= 2) cls += ' urgent';
      waitCell = '<span class="'+cls+'">'+waitingLabel(days)+'</span>';
    }

    tr.innerHTML = '<td><div class="adm-name">'+(l.name||'—')+'</div><div class="adm-email">'+(l.email||'')+'</div></td>'+
      '<td><span class="adm-type-badge adm-type-'+type+'">'+type+'</span></td>'+
      '<td><span class="adm-copy-email" data-email="'+(l.email||'')+'">'+(l.email||'—')+'</span></td>'+
      '<td class="adm-date">'+d+'</td>'+
      '<td>'+waitCell+'</td>'+
      '<td>'+(type==='planning'?'<span class="badge badge-'+(l.status||'new')+'">'+(l.status||'new')+'</span>':'<span style="color:rgba(200,184,154,0.3);font-size:0.7rem;">—</span>')+'</td>';
    tbody.appendChild(tr);
  });

  // Attach copy-email handlers
  tbody.querySelectorAll('.adm-copy-email').forEach(function(span) {
    span.addEventListener('click', function(e) {
      e.stopPropagation();
      admCopyEmail(span.getAttribute('data-email'), span);
    });
  });
}

function admCopyEmail(email, el) {
  if (!email) return;
  function done(){ var orig=el.textContent; el.textContent='Copied ✓'; el.style.color='#2e8b72'; setTimeout(function(){el.textContent=orig;el.style.color='';},1500); }
  if (navigator.clipboard) { navigator.clipboard.writeText(email).then(done).catch(done); }
  else { var ta=document.createElement('textarea'); ta.value=email; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }
}

function admExportCSV() {
  // Export currently filtered set
  var search = (document.getElementById('admSearch')||{}).value.toLowerCase()||'';
  var rows = allLeads.filter(function(l) {
    var mType = currentTypeFilter==='all' || leadType(l)===currentTypeFilter;
    var mf = currentFilter==='all' || l.status===currentFilter;
    var ms = !search||(l.name&&l.name.toLowerCase().includes(search))||(l.email&&l.email.toLowerCase().includes(search));
    return mType && mf && ms;
  });
  var headers = ['Date','Type','Name','Email','Country','Plan','Status','Message','Notes'];
  function esc(v){ v=(v==null?'':String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
  var csv = headers.join(',') + '\\n';
  rows.forEach(function(l){
    csv += [
      esc(new Date(l.created_at).toLocaleDateString('en-GB')),
      esc(leadType(l)),
      esc(l.name), esc(l.email), esc(l.country),
      esc(l.plan), esc(l.status), esc(l.message), esc(l.notes)
    ].join(',') + '\\n';
  });
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'em-leads-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  try{
    // match by client_id (same as lead id) OR by client name as fallback
    var res = await fetch(SUPABASE_URL_ADMIN + '/rest/v1/bookings?or=(client_id.eq.'+encodeURIComponent(l.id)+',client_name.ilike.'+encodeURIComponent('%'+(l.name||'')+'%')+')&select=*&order=date.asc', { headers: admAuthHeaders() });
    if(!res.ok){ box.innerHTML='<div style="font-size:0.72rem;color:rgba(200,184,154,0.3);">Could not load bookings.</div>'; return; }
    var bookings = await res.json();
    if(!bookings.length){ box.innerHTML='<div style="font-size:0.72rem;color:rgba(200,184,154,0.3);">No bookings yet. Create a plan and publish to generate them.</div>'; return; }
    // Sum totals + commission for this client
    var sumTotal=0, curT='€', sumComm=0, hasComm=false;
    bookings.forEach(function(b){
      var tm=(b.total||'').match(/(\d+(?:\.\d+)?)/); if(tm){ sumTotal+=parseFloat(tm[1]); var cc=(b.total||'').match(/[€$£]/); if(cc)curT=cc[0]; }
      var cm=(b.commission||'').match(/(\d+(?:\.\d+)?)/); if(cm && (b.commission||'').indexOf('%')<0){ sumComm+=parseFloat(cm[1]); hasComm=true; }
    });
    var summary = '<div style="display:flex;gap:1rem;margin-bottom:0.7rem;font-size:0.72rem;">'+
      '<span style="color:rgba(200,184,154,0.5);">Trip value: <b style="color:#f5f2ee;">'+curT+sumTotal+'</b></span>'+
      (hasComm?'<span style="color:rgba(200,184,154,0.5);">Your commission: <b style="color:#7799ff;">'+curT+sumComm+'</b></span>':'')+
      '</div>';
    box.innerHTML = summary + bookings.map(function(b){
      var dt = b.date ? new Date(b.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '';
      var st = b.status||'todo';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:0.5rem 0.65rem;border:1px solid rgba(200,184,154,0.1);border-radius:4px;margin-bottom:0.35rem;background:rgba(200,184,154,0.02);">'+
        '<div><div style="font-size:0.8rem;color:#f5f2ee;">'+(b.item||'—')+'</div>'+
        '<div style="font-size:0.68rem;color:rgba(200,184,154,0.45);">'+(b.host_name||'no host')+(dt?' · '+dt:'')+(b.commission?' · '+b.commission:'')+'</div></div>'+
        '<span class="badge badge-'+st+'">'+st+'</span>'+
      '</div>';
    }).join('');
  }catch(e){ box.innerHTML='<div style="font-size:0.72rem;color:rgba(200,184,154,0.3);">Error loading bookings.</div>'; }
}

function admCreatePlan() {
  if (!currentLead) return;
  var l = currentLead;
  // Split name into first/last
  var full = (l.name||'').trim();
  var parts = full.split(' ');
  var first = parts.shift() || '';
  var last = parts.join(' ');
  var params = new URLSearchParams({
    lead: '1',
    leadId: l.id || '',
    name: first,
    last: last,
    email: l.email || '',
    country: l.country || '',
    group: l.group_size || '',
    arrival: (l.dates||'').split('→')[0].trim() || '',
    departure: (l.dates||'').split('→')[1] ? (l.dates).split('→')[1].trim() : '',
    notes: l.message || ''
  });
  // Open planner with lead data. Planner is local — we pass via URL hash so it works
  // whether planner is opened from file:// or a hosted copy.
  var plannerUrl = '/em-planner-i9r8001/#' + params.toString();
  window.open(plannerUrl, '_blank');
}

function admSwitchTab(tab, btn){
  document.querySelectorAll('.adm-tab').forEach(function(t){ t.classList.remove('active'); });
  if(btn){ btn.classList.add('active'); }
  else { // programmatic switch — find the matching tab button
    document.querySelectorAll('.adm-tab').forEach(function(t){ if(t.textContent.trim().toLowerCase()===tab){ t.classList.add('active'); } });
  }
  document.getElementById('tab-leads').style.display = tab==='leads'?'block':'none';
  document.getElementById('tab-bookings').style.display = tab==='bookings'?'block':'none';
  document.getElementById('tab-hosts').style.display = tab==='hosts'?'block':'none';
  if(tab==='bookings'){ loadBookings(); loadHosts(); }
  if(tab==='hosts'){ loadHosts(); }
}

// Jump from a booking to its client's lead, highlighted
function gotoLeadFromBooking(clientId, clientName){
  admSwitchTab('leads', null);
  var lead = allLeads.find(function(l){ return l.id===clientId; });
  if(!lead && clientName){ lead = allLeads.find(function(l){ return (l.name||'').toLowerCase()===clientName.toLowerCase(); }); }
  if(lead){
    admOpenModal(lead);
    setTimeout(function(){ highlightLeadRow(lead.id); }, 100);
  } else {
    alert('Lead not found for this booking (may be a manually-added booking).');
  }
}

// Jump from a lead to bookings tab, filtered/highlighted for that client
function gotoBookingsFromLead(clientId, clientName){
  admCloseModal();
  admSwitchTab('bookings', null);
  var s = document.getElementById('bkSearch');
  if(s){ s.value = clientName || ''; }
  setTimeout(function(){ bkRender(); }, 300);
}

function highlightLeadRow(id){
  var rows = document.querySelectorAll('#admBody tr');
  rows.forEach(function(r){
    if(r.getAttribute('data-lead-id')===id){
      r.style.transition='background 0.3s';
      r.style.background='rgba(46,139,114,0.25)';
      r.scrollIntoView({behavior:'smooth', block:'center'});
      setTimeout(function(){ r.style.background=''; }, 2500);
    }
  });
}

  document.getElementById('bkTotal').textContent = t;
  document.getElementById('bkTodo').textContent = todo;
  document.getElementById('bkConfirmed').textContent = conf;
  // Sum numeric commissions (€ amounts only; % can't be summed without base)

var bkCalMonth = new Date().getMonth();
var bkCalYear = new Date().getFullYear();
var bkViewMode = 'list';

function bkToggleView(){
  bkViewMode = bkViewMode==='list' ? 'calendar' : 'list';
  document.getElementById('bkListView').style.display = bkViewMode==='list'?'block':'none';
  document.getElementById('bkCalView').style.display = bkViewMode==='calendar'?'block':'none';
  document.getElementById('bkViewToggle').textContent = bkViewMode==='list' ? '📅 Calendar' : '☰ List';
  if(bkViewMode==='calendar') renderCalendar();
}

function bkCalNav(delta){
  bkCalMonth += delta;
  if(bkCalMonth<0){ bkCalMonth=11; bkCalYear--; }
  if(bkCalMonth>11){ bkCalMonth=0; bkCalYear++; }
  renderCalendar();
}

function renderCalendar(){
  var el = document.getElementById('bkCalView');
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var first = new Date(bkCalYear, bkCalMonth, 1);
  var startDay = (first.getDay()+6)%7; // Monday-first
  var daysInMonth = new Date(bkCalYear, bkCalMonth+1, 0).getDate();

  // Group bookings by date (YYYY-MM-DD)
  var byDate = {};
  allBookings.forEach(function(b){
    if(!b.date) return;
    var d = new Date(b.date);
    if(d.getMonth()===bkCalMonth && d.getFullYear()===bkCalYear){
      var key = b.date.slice(0,10);
      (byDate[key] = byDate[key]||[]).push(b);
    }
  });

  var statusColor = {todo:'#e0a05a', reserved:'#7799ff', confirmed:'#2e8b72'};

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">'+
    '<button onclick="bkCalNav(-1)" style="background:rgba(200,184,154,0.08);border:1px solid rgba(200,184,154,0.15);color:#f5f2ee;padding:0.4rem 0.9rem;border-radius:4px;cursor:pointer;">←</button>'+
    '<div style="font-family:\'Playfair Display\',serif;font-size:1.2rem;color:#f5f2ee;">'+monthNames[bkCalMonth]+' '+bkCalYear+'</div>'+
    '<button onclick="bkCalNav(1)" style="background:rgba(200,184,154,0.08);border:1px solid rgba(200,184,154,0.15);color:#f5f2ee;padding:0.4rem 0.9rem;border-radius:4px;cursor:pointer;">→</button>'+
  '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:rgba(200,184,154,0.08);border:1px solid rgba(200,184,154,0.08);">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    html += '<div style="background:#0f0f0f;padding:0.5rem;text-align:center;font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(200,184,154,0.4);">'+d+'</div>';
  });
  for(var i=0;i<startDay;i++){ html += '<div style="background:#0a0a0a;min-height:80px;"></div>'; }
  var today = new Date(); var todayKey = today.toISOString().slice(0,10);
  for(var day=1;day<=daysInMonth;day++){
    var key = bkCalYear+'-'+String(bkCalMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var items = byDate[key]||[];
    var isToday = key===todayKey;
    html += '<div style="background:#0a0a0a;min-height:80px;padding:0.4rem;'+(isToday?'box-shadow:inset 0 0 0 1px rgba(46,139,114,0.5);':'')+'">'+
      '<div style="font-size:0.7rem;color:'+(isToday?'#3aab8a':'rgba(200,184,154,0.5)')+';margin-bottom:0.25rem;font-weight:'+(isToday?'600':'400')+';">'+day+'</div>'+
      items.map(function(b){
        var col = statusColor[b.status||'todo']||'#888';
        return '<div onclick="bkEdit(\''+b.id+'\')" style="font-size:0.6rem;color:#f5f2ee;background:'+col+'22;border-left:2px solid '+col+';padding:0.15rem 0.3rem;margin-bottom:0.2rem;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="'+(b.client_name||'')+' — '+(b.item||'')+'">'+(b.item||'—')+'</div>';
      }).join('')+
    '</div>';
  }
  html += '</div>';
  html += '<div style="display:flex;gap:1rem;margin-top:1rem;font-size:0.62rem;color:rgba(200,184,154,0.5);">'+
    '<span><span style="display:inline-block;width:8px;height:8px;background:#e0a05a;border-radius:2px;"></span> To book</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;background:#7799ff;border-radius:2px;"></span> Reserved</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;background:#2e8b72;border-radius:2px;"></span> Confirmed</span>'+
  '</div>';
  el.innerHTML = html;
}

  var m = document.createElement('div');
  m.id='msgHostModal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100000;display:flex;align-items:center;justify-content:center;padding:1.5rem;';
  m.innerHTML='<div style="background:#111;border:1px solid rgba(200,184,154,0.15);border-radius:8px;padding:1.75rem;max-width:480px;width:100%;">'+
    '<div style="font-family:\'Playfair Display\',serif;font-size:1.15rem;color:#f5f2ee;margin-bottom:0.3rem;">Message to '+(host?host.name:'host')+'</div>'+
    '<div style="font-size:0.68rem;color:rgba(200,184,154,0.4);margin-bottom:1rem;">Review, then send however you like.</div>'+
    '<textarea id="msgHostText" style="width:100%;height:200px;background:rgba(200,184,154,0.05);border:1px solid rgba(200,184,154,0.15);color:#f5f2ee;padding:0.75rem;font-family:\'DM Sans\',sans-serif;font-size:0.82rem;line-height:1.6;outline:none;border-radius:4px;resize:vertical;">'+msg.replace(/</g,'&lt;')+'</textarea>'+
    '<div style="display:flex;gap:0.5rem;margin-top:0.85rem;flex-wrap:wrap;">'+
      (phone?'<a href="#" target="_blank" id="msgWaBtn" style="flex:1;min-width:120px;text-align:center;background:#25D366;color:#fff;padding:0.65rem;border-radius:4px;text-decoration:none;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;">WhatsApp</a>':'')+
      (email?'<a href="#" id="msgEmailBtn" style="flex:1;min-width:120px;text-align:center;background:rgba(200,184,154,0.1);color:#c8b89a;padding:0.65rem;border-radius:4px;text-decoration:none;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;border:1px solid rgba(200,184,154,0.2);">Email</a>':'')+
      '<button onclick="msgHostCopy()" style="flex:1;min-width:120px;background:rgba(46,139,114,0.15);color:#3aab8a;border:1px solid rgba(46,139,114,0.3);padding:0.65rem;border-radius:4px;cursor:pointer;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;">Copy</button>'+
    '</div>'+
    '<button onclick="document.getElementById(\'msgHostModal\').remove()" style="width:100%;background:none;border:none;color:rgba(200,184,154,0.35);padding:0.75rem;margin-top:0.5rem;cursor:pointer;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;">Close</button>'+
  '</div>';
  m.addEventListener('click',function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
  // Wire dynamic links to the (editable) textarea content
  function refreshLinks(){
    var t = encodeURIComponent(document.getElementById('msgHostText').value);
    var wa = document.getElementById('msgWaBtn'); if(wa) wa.href = 'https://wa.me/'+phone+'?text='+t;
    var em = document.getElementById('msgEmailBtn'); if(em) em.href = 'mailto:'+email+'?subject='+encodeURIComponent('Booking request — '+(b.item||''))+'&body='+t;
  }
  document.getElementById('msgHostText').addEventListener('input', refreshLinks);
  refreshLinks();
}

function msgHostCopy(){
  var t = document.getElementById('msgHostText');
  t.select();
  if(navigator.clipboard){ navigator.clipboard.writeText(t.value).catch(function(){}); }
  else { try{document.execCommand('copy');}catch(e){} }
  event.target.textContent='Copied ✓';
  setTimeout(function(){ event.target.textContent='Copy'; },1500);
}

function bkCalcTotal(){
  var p = document.getElementById('bkClientPrice').value.trim();
  var n = parseInt(document.getElementById('bkPersons').value)||1;
  var m = p.match(/(\d+(?:\.\d+)?)/);
  var cur = (p.match(/[€$£]/)||['€'])[0];
  document.getElementById('bkTotal').value = m ? (cur + (parseFloat(m[1])*n)) : '';
}
function bkCloseModal(){ document.getElementById('bkModal').classList.remove('open'); }

async function bkSave(){
  var hostSel = document.getElementById('bkHost');
  var hostName = hostSel.value ? (allHosts.find(function(h){return h.id===hostSel.value;})||{}).name||'' : '';
  var row = {
    id: editingBookingId || ('b'+Date.now()),
    client_name: document.getElementById('bkClient').value.trim(),
    item: document.getElementById('bkItem').value.trim(),
    host_id: hostSel.value,
    host_name: hostName,
    date: document.getElementById('bkDate').value,
    status: document.getElementById('bkStatus').value,
    client_price: document.getElementById('bkClientPrice').value.trim(),
    price_per_person: document.getElementById('bkClientPrice').value.trim(),
    persons: parseInt(document.getElementById('bkPersons').value)||1,
    total: document.getElementById('bkTotal').value.trim(),
    commission: document.getElementById('bkCommissionInput').value.trim(),
    notes: document.getElementById('bkNotes').value.trim()
  };
  if(!row.client_name || !row.item){ alert('Client and item are required.'); return; }
  var res = await fetch(SUPABASE_URL_ADMIN + '/rest/v1/bookings', {
    method:'POST',
    headers: admAuthHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(row)
  });
  if(res.status===401){ admForceRelogin(); return; }
  if(res.ok){ bkCloseModal(); loadBookings(); }
  else{ alert('Save failed: '+res.status); }
}

async function bkDelete(){
  if(!editingBookingId) return;
  if(!confirm('Delete this booking?')) return;
  var res = await fetch(SUPABASE_URL_ADMIN + '/rest/v1/bookings?id=eq.'+encodeURIComponent(editingBookingId), { method:'DELETE', headers: admAuthHeaders() });
  if(res.ok){ bkCloseModal(); loadBookings(); }
}

// Close booking/host modals on outside click
document.addEventListener('click', function(e){
  var bm = document.getElementById('bkModal'); if(bm && e.target===bm) bkCloseModal();
  var hm = document.getElementById('htModal'); if(hm && e.target===hm) htCloseModal();
});

// Init on page load
window.addEventListener('DOMContentLoaded', initAdmin);
if (document.readyState !== 'loading') initAdmin();

// Auto-refresh
setInterval(function(){
  if (admAccessToken) loadLeads();
}, 60000);
</script>
